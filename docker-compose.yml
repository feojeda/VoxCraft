# VoxCraft Docker Compose — full stack local development
#
# Services:
#   api:      FastAPI application (hot-reload enabled)
#   worker:   Celery worker for TTS generation
#   redis:    Message broker and result backend
#   frontend: Next.js frontend
#
# Usage:
#   docker compose up                    # Start all services
#   docker compose up redis api          # Start API + Redis only
#   docker compose logs -f worker        # Follow worker logs
#
# GPU inference:
#   For GPU inference, add to worker service:
#   deploy:
#     resources:
#       reservations:
#         devices:
#           - driver: nvidia
#             count: 1
#             capabilities: [gpu]
#   Requires NVIDIA Container Toolkit installed on host.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - audio_output:/app/audio_output
    networks:
      - voxcraft
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # Memory limit to prevent resource exhaustion (T-05-02)
    mem_limit: 512m

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - audio_output:/app/audio_output
    networks:
      - voxcraft
    # GPU access via NVIDIA Container Toolkit needed for production
    # For local dev without GPU, the worker runs on CPU (slow but functional)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command: celery -A workers.celery_app worker --loglevel=info --queues=tts
    # Worker concurrency=1 to limit GPU load (T-05-02)
    mem_limit: 4g

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voxcraft
    command: redis-server --appendonly yes

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - voxcraft
    environment:
      - NEXT_PUBLIC_API_URL=/api

networks:
  voxcraft:
    driver: bridge

volumes:
  redis_data:
  audio_output:
